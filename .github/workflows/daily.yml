name: Actualizar mapa de setas

on:
  schedule:
    # GitHub puede retrasar o incluso saltarse ejecuciones programadas cuando está saturado,
    # sobre todo en las horas en punto. Por eso hay dos horarios, en minutos poco concurridos:
    # si el primero ya publicó la previsión de hoy, el segundo termina enseguida sin hacer nada.
    - cron: "47 1  * * *"    # 00:47 UTC
    - cron: "17 17 * * *"    # 16:17 UTC, de respaldo
  workflow_dispatch:        # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el código está completo
        run: |
          faltan=0
          for f in pipeline/__init__.py pipeline/config.py pipeline/grid.py pipeline/habitat.py pipeline/mfe.py \
                   pipeline/weather.py pipeline/soil.py pipeline/satellite.py pipeline/model.py pipeline/features.py \
                   pipeline/calibrate.py pipeline/species_info.py pipeline/run_daily.py requirements.txt docs/index.html; do
            [ -f "$f" ] || { echo "::error::Falta el fichero $f"; faltan=1; }
          done
          grep -q "def _fetch_chunk" pipeline/weather.py || { echo "::error::pipeline/weather.py es una versión antigua"; faltan=1; }
          grep -q '"ph"' pipeline/config.py || { echo "::error::pipeline/config.py es una versión antigua (sin pH)"; faltan=1; }
          grep -q "load_ph" pipeline/run_daily.py || { echo "::error::pipeline/run_daily.py es una versión antigua (sin pH ni humedad del suelo)"; faltan=1; }
          grep -q "rasterio" requirements.txt || { echo "::error::requirements.txt es una versión antigua (falta rasterio)"; faltan=1; }
          [ $faltan = 0 ] && echo "Código completo y actualizado"
          exit $faltan

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Capa GBIF (solo la primera vez)
        run: test -f data/habitat_gbif.json || python -m pipeline.habitat

      - name: pH del suelo (solo la primera vez)
        run: test -f data/ph_0.1.json || python -m pipeline.soil

      - name: Previsión del día
        env:   # opcionales: si no existen, se usa solo la humedad del modelo
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}   # opcional (plan de pago)
        # Si Open-Meteo falla del todo, espera 10 min y lo vuelve a intentar (hasta 3 veces).
        # Los lotes ya descargados se reutilizan, así que cada intento solo pide lo que falta.
        # Si los 3 fallan, el paso falla y la web conserva la previsión del día anterior.
        run: |
          for i in 1 2 3; do
            python -m pipeline.run_daily && exit 0
            echo "Intento $i fallido"; [ $i -lt 3 ] && sleep 600
          done
          exit 1

      - name: Publicar
        run: |
          git config user.name "setas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git commit -m "Previsión $(date -u +%F)" || echo "Sin cambios"
          git pull --rebase
          git push
