name: Actualizar mapa de setas

on:
  schedule:
    - cron: "30 4 * * *"   # todos los días a las 04:30 UTC
  workflow_dispatch:        # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Capa GBIF (solo la primera vez)
        run: test -f data/habitat_gbif.json || python -m pipeline.habitat

      - name: Previsión del día
        run: python -m pipeline.run_daily

      - name: Publicar
        run: |
          git config user.name "setas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git commit -m "Previsión $(date -u +%F)" || echo "Sin cambios"
          git push
